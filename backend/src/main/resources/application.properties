server.port=8080
spring.application.name=campus-placement-system

# Active profile: 'dev' uses in-memory MySQL-compatible H2 for instant local running; 'mysql' connects to MySQL 8+
spring.profiles.active=dev

# File upload configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration
app.jwt.secret=CampusPlacementManagementSystemSuperSecureSecretKeyThatIsAtLeast256BitsLong2026!
app.jwt.expiration-ms=86400000

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging
logging.level.com.placement.management=INFO
logging.level.org.springframework.security=WARN
